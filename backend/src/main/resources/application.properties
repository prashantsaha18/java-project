spring.application.name=library-management-system

# --- Database ---
# For local dev without Postgres installed, switch the active profile to "h2"
# (see application-h2.properties) by running with --spring.profiles.active=h2
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET:this-is-a-dev-only-secret-change-it-before-deploying-anywhere-real}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Mail (overdue reminders) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Server ---
server.port=${PORT:8080}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
